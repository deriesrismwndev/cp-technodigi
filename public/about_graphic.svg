<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" class="w-full h-auto">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22b4a6" />
      <stop offset="50%" stop-color="#3bd4c5" />
      <stop offset="100%" stop-color="#1a2e62" />
    </linearGradient>

    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22b4a6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22b4a6" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22b4a6" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#22b4a6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#22b4a6" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow-glass">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="250" cy="200" r="160" fill="url(#glow-core)" />

  <!-- Main Liquid Glass Backing Board -->
  <rect x="30" y="30" width="440" height="340" rx="24" fill="url(#glass-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" filter="url(#shadow-glass)" />
  <rect x="31" y="31" width="438" height="338" rx="23" stroke="url(#line-grad)" stroke-opacity="0.3" stroke-width="1" fill="none" />

  <!-- Circuit Grid Overlay Lines -->
  <path d="M 80 100 L 420 100" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />
  <path d="M 80 200 L 420 200" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />
  <path d="M 80 300 L 420 300" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />
  <path d="M 150 60 L 150 340" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />
  <path d="M 250 60 L 250 340" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />
  <path d="M 350 60 L 350 340" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />

  <!-- Central Orbit & Tech Ring -->
  <circle cx="250" cy="200" r="110" stroke="#22b4a6" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="250" cy="200" r="80" stroke="url(#primary-grad)" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- Central Glowing AI Core -->
  <circle cx="250" cy="200" r="45" fill="#0d1220" stroke="#22b4a6" stroke-width="2" filter="url(#blur-glow)" />
  <circle cx="250" cy="200" r="30" fill="url(#primary-grad)" opacity="0.8" />
  
  <!-- Inner AI Core Symbol (Spark / Brain Node) -->
  <path d="M 250 185 L 254 196 L 265 200 L 254 204 L 250 215 L 246 204 L 235 200 L 246 196 Z" fill="#ffffff" />

  <!-- Floating Node 1: AI Solutions (Top Right) -->
  <g transform="translate(340, 100)">
    <line x1="-90" y1="100" x2="0" y2="0" stroke="#22b4a6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3" />
    <rect x="-60" y="-20" width="120" height="40" rx="12" fill="#0a0f1a" fill-opacity="0.9" stroke="#22b4a6" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="-40" cy="0" r="5" fill="#22b4a6" />
    <text x="-25" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="600">AI SOLUTIONS</text>
  </g>

  <!-- Floating Node 2: Automation (Bottom Right) -->
  <g transform="translate(350, 290)">
    <line x1="-100" y1="-90" x2="0" y2="0" stroke="#22b4a6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3" />
    <rect x="-60" y="-20" width="120" height="40" rx="12" fill="#0a0f1a" fill-opacity="0.9" stroke="#3bd4c5" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="-40" cy="0" r="5" fill="#3bd4c5" />
    <text x="-25" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="600">AUTOMATION</text>
  </g>

  <!-- Floating Node 3: Data Analytics (Top Left) -->
  <g transform="translate(150, 110)">
    <line x1="100" y1="90" x2="0" y2="0" stroke="#22b4a6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3" />
    <rect x="-65" y="-20" width="130" height="40" rx="12" fill="#0a0f1a" fill-opacity="0.9" stroke="#22b4a6" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="-45" cy="0" r="5" fill="#22b4a6" />
    <text x="-30" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="600">DATA ANALYTICS</text>
  </g>

  <!-- Floating Node 4: Digital Management (Bottom Left) -->
  <g transform="translate(140, 280)">
    <line x1="110" y1="-80" x2="0" y2="0" stroke="#22b4a6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3" />
    <rect x="-70" y="-20" width="140" height="40" rx="12" fill="#0a0f1a" fill-opacity="0.9" stroke="#1a2e62" stroke-opacity="0.8" stroke-width="1" />
    <circle cx="-50" cy="0" r="5" fill="#22b4a6" />
    <text x="-35" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="600">MANAGEMENT</text>
  </g>

  <!-- Corner Tech Accent Reticles -->
  <path d="M 50 60 L 70 60 M 50 60 L 50 80" stroke="#22b4a6" stroke-width="2" stroke-linecap="round" />
  <path d="M 450 60 L 430 60 M 450 60 L 450 80" stroke="#22b4a6" stroke-width="2" stroke-linecap="round" />
  <path d="M 50 340 L 70 340 M 50 340 L 50 320" stroke="#22b4a6" stroke-width="2" stroke-linecap="round" />
  <path d="M 450 340 L 430 340 M 450 340 L 450 320" stroke="#22b4a6" stroke-width="2" stroke-linecap="round" />

  <!-- Data Pulse Circles -->
  <circle cx="250" cy="90" r="4" fill="#22b4a6" />
  <circle cx="250" cy="310" r="4" fill="#3bd4c5" />
  <circle cx="140" cy="200" r="4" fill="#22b4a6" />
  <circle cx="360" cy="200" r="4" fill="#22b4a6" />
</svg>
